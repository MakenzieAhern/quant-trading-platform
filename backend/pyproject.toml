[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "quant-trading-platform-backend"
version = "1.0.0"
description = "Backend for a deterministic personal quantitative trading platform"
requires-python = "==3.12.*"
dependencies = [
  "alembic>=1.17,<2",
  "asyncpg>=0.31,<0.32",
  "fastapi>=0.141,<0.142",
  "pydantic-settings>=2.15,<3",
  "pyarrow>=25,<26",
  "redis>=7,<8",
  "sqlalchemy>=2.0.52,<2.1",
  "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pip-tools>=7.5,<8",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
