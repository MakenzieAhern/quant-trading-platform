name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://quant:quant_dev_only@localhost:5432/quant_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quant_test
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant -d quant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: pip install -e backend --no-deps
      - run: |
          alembic upgrade head
          alembic downgrade 20260904_0001
          alembic upgrade head
          alembic check
        working-directory: backend
      - run: pytest backend/tests
      - run: ruff check backend
      - run: ruff format --check backend
      - run: mypy backend/app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose -f compose.test.yml config --quiet
      - run: docker compose -f docker-compose.yml -f compose.release.yml config --quiet
      - run: docker compose -f docker-compose.yml -f compose.release.yml config --format json | python3 -c 'import json, sys; assert json.load(sys.stdin)["services"]["frontend"].get("command") is None'
      - run: |
          docker compose -p qtp-release-smoke -f docker-compose.yml -f compose.release.yml build frontend
          container_id=$(docker run --rm -d -p 127.0.0.1:15173:5173 qtp-release-smoke-frontend)
          trap 'docker stop "$container_id" >/dev/null' EXIT
          curl -fsSI --retry 5 --retry-all-errors --retry-delay 1 http://127.0.0.1:15173/
          curl -fsSI http://127.0.0.1:15173/help
