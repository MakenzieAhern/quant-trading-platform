# Local release rehearsal; requires Compose v2.24.4+ for !override.
services:
  backend:
    environment:
      APP_ENV: production
    command: !reset null
    volumes: !override
      - ./data:/workspace/data:ro
      - ${RESEARCH_DATA_ROOT:-./data/research}:/workspace/research:ro
      - product_data:/workspace/product
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.release
    command: !reset null
    volumes: !reset []
    environment: !reset {}
