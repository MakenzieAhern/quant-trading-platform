name: quant-trading-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quant_platform
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://quant:quant_dev_only@postgres:5432/quant_platform
      REDIS_URL: redis://redis:6379/0
      BROKER_MODE: paper
      MARKET_DATA_PROVIDER: csv
      MARKET_DATA_PATH: /workspace/data/raw
      BACKTEST_FIXTURE_PATH: /workspace/data/fixtures
      RESEARCH_DATA_PATH: /workspace/research
      PRODUCT_DATA_PATH: /workspace/product
      FRONTEND_ORIGIN: http://localhost:5173
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/workspace/data
      - ${RESEARCH_DATA_ROOT:-./data/research}:/workspace/research:ro
      - product_data:/workspace/product
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    command: ["sh", "-c", "npm ci && exec npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  product_data:
